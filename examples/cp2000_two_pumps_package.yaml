# ---------------------------------------------------------------------------
# Delta CP2000 + Hamlet "Single Pump V9.0.1" PLC program — Home Assistant Modbus package (2 pumps)
# Hamlet Elektries
#
# Put this file in /config/packages/cp2000_pump.yaml and restart Home Assistant.
#
# Connection: Waveshare RS485-to-Ethernet, Protocol "Modbus TCP to RTU", Multi-host = Yes
#   -> change host / port below if your Waveshare is different.
#
# TWO PUMPS on the same RS-485 line (one Waveshare):
#   PUMP 1: drive = slave 1 (09-00 = 1), PLC = slave 2 (09-35 = 2)   -> sensor.pump_* / sensor.vfd_*
#   PUMP 2: drive = slave 3 (09-00 = 3), PLC = slave 4 (09-35 = 4)   -> sensor.pump2_* / sensor.vfd2_*
#   Every address on the line must be different.
#
# The card STARTS / STOPS / RESETS the pump by writing D395 (APP_START_AND_RESET) = 1 / 0 / 2
#   — only works in App mode (D394 = 1 APP AUTO or 2 APP MAN); in PANEL mode the program ignores it.
#
# PLC register map (Delta): D<n> = 4096 + n,  M<n> = 2048 + n
# Drive parameter GG-NN = GG*256 + NN
#
# The "MENU SETTINGS" sensors feed the card's MENU key (read every 10 min, refreshed right after a change).
# ---------------------------------------------------------------------------

modbus:
  - name: vfd                       # the card's "Modbus hub name"
    type: tcp                       # Waveshare protocol = Modbus TCP to RTU
    host: 192.168.10.254
    port: 510
    timeout: 2               # wait max 2 s for an answer (a slow drive no longer blocks the whole line)
    delay: 1

    sensors:
      # ######################## PUMP 1 ########################
      # ================= DRIVE (slave 1) =================
      - name: VFD Fault Code
        unique_id: vfd_fault_code
        slave: 1
        address: 8448               # 2100H
        input_type: holding
        data_type: uint16
        scan_interval: 5

      - name: VFD Status Word
        unique_id: vfd_status_word
        slave: 1
        address: 8449               # 2101H
        input_type: holding
        data_type: uint16
        scan_interval: 5

      - name: VFD Output Frequency
        unique_id: vfd_output_frequency
        slave: 1
        address: 8451               # 2103H
        input_type: holding
        data_type: uint16
        scale: 0.01
        precision: 2
        unit_of_measurement: Hz
        device_class: frequency
        state_class: measurement
        scan_interval: 5

      - name: VFD Output Current
        unique_id: vfd_output_current
        slave: 1
        address: 8452               # 2104H — compare with keypad; big drives use 0.1
        input_type: holding
        data_type: uint16
        scale: 0.01
        precision: 1
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        scan_interval: 5

      - name: VFD Output Voltage
        unique_id: vfd_output_voltage
        slave: 1
        address: 8454               # 2106H
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 0
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        scan_interval: 10

      - name: VFD DC Bus Voltage
        unique_id: vfd_dc_bus_voltage
        slave: 1
        address: 8453               # 2105H
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 0
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        scan_interval: 15

      - name: VFD IGBT Temperature
        unique_id: vfd_igbt_temperature
        slave: 1
        address: 8718               # 220EH
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 30

      # ================= PUMP PROGRAM (PLC, slave 2) =================
      - name: Pump Pressure
        unique_id: pump_plc_pressure
        slave: 2
        address: 4158               # D62  PRESENT VALUE (0.00 bar)
        input_type: holding
        data_type: int16
        scale: 0.01
        precision: 2
        unit_of_measurement: bar
        device_class: pressure
        state_class: measurement
        scan_interval: 5

      - name: Pump Setpoint
        unique_id: pump_plc_setpoint
        slave: 2
        address: 4392               # D296 SP_DISPLAY — SETPOINT as shown on the keypad (0.00 bar)
                                    # (the card WRITES new setpoints to D304 = 4400; the program copies it to D296)
        input_type: holding
        data_type: int16
        scale: 0.01
        precision: 2
        unit_of_measurement: bar
        device_class: pressure
        scan_interval: 5

      - name: Pump D318
        unique_id: pump_plc_d318
        slave: 2
        address: 4414               # D318 COUNT_DOWN_DISPLAY (small box under PRESENT VALUE, 0.0)
