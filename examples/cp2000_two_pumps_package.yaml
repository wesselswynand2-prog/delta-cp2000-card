        address: 4462               # D366 OUTPUT_PWR_CONSUMPTION
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        scan_interval: 60

      - name: Pump Heatsink Temperature
        unique_id: pump_plc_d364
        slave: 2
        address: 4460               # D364 HEATSINK_TEMP
        input_type: holding
        data_type: uint16
